// 仪表版 · 平板仪表板 Android 壳
// 仓库顺序：阿里云镜像优先（国内快），官方源兜底。
// 首次构建建议先 --offline（AGP 8.7.3 与 Gradle 8.9 本机缓存里已有）；
// 真缺依赖时去掉 --offline，会自动走下面的镜像。

pluginManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
}

rootProject.name = "TabletDash"
include ':app'
