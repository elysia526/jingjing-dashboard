org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# 本项目不使用 androidx（连 WebViewAssetLoader 都是自己实现的），
# 显式关掉可以让 AGP 少做很多无谓的检查和转换。
android.useAndroidX=false
android.enableJetifier=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# 工程路径里有中文（C:\Users\熊凯\Desktop\平板仪表板设计\套壳），
# AGP 默认会直接拒绝构建。开这个开关放行；
# 万一 aapt2 真的处理不了中文路径，构建脚本会自动把工程复制到纯英文路径再编。
android.overridePathCheck=true

# 本机两个 JBR 都缺 jmods，jlink 跑不了，因此关掉 AGP 造 JDK 镜像那一步。
# 配合 app/build.gradle 里把编译目标钉在 Java 8，双保险。
android.experimental.disableJdkImageTransform=true
