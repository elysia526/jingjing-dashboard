<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>background.js 自检</title>
<style>body{background:#0b0d10;color:#7CFC98;font:18px/1.5 Consolas,monospace;padding:16px;white-space:pre-wrap}</style>
</head><body>
<div id="bg" aria-hidden="true"><div class="bg-img" id="bgA"></div><div class="bg-img" id="bgB"></div></div>
<pre id="out">running…</pre>
<script src="../assets/js/background.js"></script>
<script>
var out = [], fail = 0;
function log(s) { out.push(s); document.getElementById('out').textContent = out.join('\n'); }
function ok(name, cond, extra) {
  if (!cond) { fail++; }
  log((cond ? '  PASS  ' : '  FAIL  ') + name + (extra ? '   → ' + extra : ''));
}
function at(hh, mm) { var d = new Date(); d.setHours(hh, mm, 0, 0); return d; }

/* 造一张小图当测试素材 */
function makeFile(name, color, w, h) {
  w = w || 800; h = h || 500;
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var g = c.getContext('2d');
  g.fillStyle = color; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.4)';
  g.fillRect(50, 50, Math.max(20, w / 4), Math.max(20, h / 4));
  return new Promise(function (res) {
    c.toBlob(function (b) { res(new File([b], name, { type: 'image/jpeg' })); }, 'image/jpeg', 0.9);
  });
}

/* 等存储后端探测完（IndexedDB 会挂起，靠超时兜底） */
function waitStore() {
  return new Promise(function (res) { Background.onReady(function (state, moved) { res({ state: state, moved: moved }); }); });
}

(async function () {
  /* ---------------- 存储后端 ---------------- */
  log('=== 0. 存储后端探测 ===');
  Background.start('light');
  var st = await waitStore();
  ok('后端已确定（idb 或 ls）', st.state === 'idb' || st.state === 'ls', st.state);
  ok('容量上限已按后端切换', Background.softCap() === (st.state === 'idb' ? 48 * 1048576 : 4.5 * 1048576),
    (Background.softCap() / 1048576).toFixed(1) + ' MB');
  log('      （file:// 打开时 IndexedDB 会挂起 → 预期就是 ls，属正常降级）');

  /* ---------------- 导入分辨率上限 ---------------- */
  log('\n=== 0b. 导入长边上限 ===');
  Background.setCfg({ res: 'hd' });   ok('高清档 = 2560', Background.targetLongEdge() === 2560);
  Background.setCfg({ res: 'full' }); ok('超清档 = 3840', Background.targetLongEdge() === 3840);
  Background.setCfg({ res: 'auto' });
  var auto = Background.targetLongEdge();
  ok('自适应档落在 1920–3840', auto >= 1920 && auto <= 3840, auto + ' px');

  /* ---------------- 时段判定 ---------------- */
  log('\n=== 1. 时段判定（白天 06:00 → 夜间 18:00）===');
  Background.setCfg({ dayStart: '06:00', nightStart: '18:00' });
  ok('10:00 判为白天', Background.currentSlot(at(10, 0)) === 'day', Background.currentSlot(at(10, 0)));
  ok('05:59 判为夜间', Background.currentSlot(at(5, 59)) === 'night', Background.currentSlot(at(5, 59)));
  ok('06:00 判为白天', Background.currentSlot(at(6, 0)) === 'day', Background.currentSlot(at(6, 0)));
  ok('17:59 判为白天', Background.currentSlot(at(17, 59)) === 'day', Background.currentSlot(at(17, 59)));
  ok('18:00 判为夜间', Background.currentSlot(at(18, 0)) === 'night', Background.currentSlot(at(18, 0)));
  ok('23:30 判为夜间', Background.currentSlot(at(23, 30)) === 'night', Background.currentSlot(at(23, 30)));

  log('\n=== 2. 跨零点配置（白天 20:00 → 次日 06:00）===');
  Background.setCfg({ dayStart: '20:00', nightStart: '06:00' });
  ok('22:00 判为白天', Background.currentSlot(at(22, 0)) === 'day', Background.currentSlot(at(22, 0)));
  ok('10:00 判为夜间', Background.currentSlot(at(10, 0)) === 'night', Background.currentSlot(at(10, 0)));
  ok('03:00 判为白天', Background.currentSlot(at(3, 0)) === 'day', Background.currentSlot(at(3, 0)));
  Background.setCfg({ dayStart: '06:00', nightStart: '18:00' });

  log('\n=== 3. 两个时间相同时不该死循环或全判夜间 ===');
  Background.setCfg({ dayStart: '08:00', nightStart: '08:00' });
  ok('一律判为白天', Background.currentSlot(at(3, 0)) === 'day' && Background.currentSlot(at(20, 0)) === 'day');
  Background.setCfg({ dayStart: '06:00', nightStart: '18:00' });

  /* ---------------- 导入 / 压缩 / 落盘 ---------------- */
  log('\n=== 4. 导入 / 压缩 / 落盘（异步）===');
  await Background.clearAll();
  var f1 = await makeFile('白天图.jpg', '#2c5aa0');
  var f2 = await makeFile('夜间图.jpg', '#101828');
  var r = await Background.addFiles([f1, f2]);
  ok('两张都导入成功', r.added.length === 2, '新增 ' + r.added.length + '，失败 ' + r.failed.length);
  ok('元数据有两条', Background.list().length === 2);
  ok('占用字节已统计', Background.usedBytes() > 0, (Background.usedBytes() / 1024).toFixed(0) + ' KB');

  var m0 = Background.list()[0];
  var d0 = await Background.getData(m0.id);
  var t0 = await Background.getThumb(m0.id);
  ok('图片数据可读回（Promise）', (d0 || '').indexOf('data:image') === 0, (d0 || '').slice(0, 22) + '…');
  ok('缩略图已生成', (t0 || '').indexOf('data:image') === 0, (t0 || '').length + ' 字符');
  ok('缩略图远小于原图', t0.length < d0.length / 3);
  ok('peekThumb 命中内存缓存', Background.peekThumb(m0.id) === t0);
  ok('长边未超过自适应上限', Math.max(m0.w, m0.h) <= Background.targetLongEdge(), m0.w + '×' + m0.h);

  log('\n=== 4b. 大图按「超清」导入时不被压到 1920 ===');
  Background.setCfg({ res: 'full' });
  var big = await makeFile('大图.jpg', '#7a4a1e', 3000, 1800);
  var rb = await Background.addFiles([big]);
  ok('大图导入成功', rb.added.length === 1, rb.failed[0] && rb.failed[0].why);
  var mb = Background.list()[Background.list().length - 1];
  ok('长边保留到 3000（未按老逻辑压到 1920）', mb.w === 3000, mb.w + '×' + mb.h);
  Background.setCfg({ res: 'auto' });
  await Background.removeItem(mb.id);

  /* ---------------- 时段分组 ---------------- */
  log('\n=== 5. 时段分组后，随时段取图 ===');
  var list = Background.list();
  await Background.setSlot(list[0].id, 'day');
  await Background.setSlot(list[1].id, 'night');
  Background.setCfg({ dayStart: '06:00', nightStart: '18:00' });
  var expect = Background.currentSlot(new Date());
  ok('候选数恒为 1（各时段各一张）', Background.candidates().length === 1,
    '当前 ' + expect + '，候选 ' + Background.candidates().length);
  ok('候选取自对应时段', Background.candidates()[0].slot === expect, Background.candidates()[0].slot);
  await Background.setSlot(list[1].id, 'all');
  await Background.setSlot(list[0].id, 'all');
  ok('标为全天后两段都能用', Background.candidates().length === 2);

  /* ---------------- 渲染链路 ---------------- */
  log('\n=== 5b. 渲染链路（refresh 是异步的）===');
  Background.setCfg({ mode: 'image' });
  var shown = await Background.refresh(true);
  ok('refresh 返回了实际显示的 id', !!shown, shown);
  ok('图片已贴到背景层', (document.getElementById('bgA').style.backgroundImage +
    document.getElementById('bgB').style.backgroundImage).indexOf('data:image') >= 0);

  log('\n=== 5c. 定时轮播（schedule → refresh(false)）===');
  function activeBgLayer() {
    if (document.getElementById('bgA').classList.contains('on')) { return 'bgA'; }
    if (document.getElementById('bgB').classList.contains('on')) { return 'bgB'; }
    return '';
  }
  var activeBefore = activeBgLayer();
  Background.setCfg({ intervalSec: 1 });
  Background.schedule();
  await new Promise(function (res) { setTimeout(res, 1500); });
  Background.stop();
  var activeAfter = activeBgLayer();
  ok('到轮播间隔后已切到另一层', !!activeBefore && !!activeAfter && activeAfter !== activeBefore,
    activeBefore + ' → ' + activeAfter);

  log('\n=== 5d. 候选图片变化后重建轮播调度 ===');
  var slotNow = Background.currentSlot();
  var otherSlot = slotNow === 'day' ? 'night' : 'day';
  await Background.setSlot(list[0].id, slotNow);
  await Background.setSlot(list[1].id, otherSlot);
  Background.setCfg({ intervalSec: 1 });
  Background.schedule();
  await Background.setSlot(list[1].id, 'all');
  var activeBeforeUpdate = activeBgLayer();
  await new Promise(function (res) { setTimeout(res, 1500); });
  Background.stop();
  var activeAfterUpdate = activeBgLayer();
  ok('候选数从 1 增至 2 后自动开始轮播', !!activeBeforeUpdate && !!activeAfterUpdate &&
    activeAfterUpdate !== activeBeforeUpdate, activeBeforeUpdate + ' → ' + activeAfterUpdate);
  Background.setCfg({ intervalSec: 0 });
  Background.setCfg({ mode: 'off' });

  /* ---------------- 删除与容量回收 ---------------- */
  log('\n=== 6. 删除与容量回收 ===');
  var before = Background.usedBytes();
  await Background.removeItem(list[0].id);
  ok('列表少了一条', Background.list().length === 1);
  ok('占用下降', Background.usedBytes() < before, (Background.usedBytes() / 1024).toFixed(0) + ' KB');
  ok('图片数据已清掉', (await Background.getData(list[0].id)) === null);
  ok('缩略图也清了', (await Background.getThumb(list[0].id)) === '');

  await Background.clearAll();
  ok('清空后占用归零', Background.usedBytes() === 0 && Background.list().length === 0);

  /* ---------------- 老数据迁移 ---------------- */
  log('\n=== 7. localStorage 老数据迁移 ===');
  if (st.state === 'idb') {
    await Background.clearAll();
    /* 模拟"老版本留下来的"数据：只有 localStorage，没有 IndexedDB 记录 */
    var legacyId = 'legacytest1';
    localStorage.setItem('dash.bg.img.' + legacyId, d0);
    localStorage.setItem('dash.bg.thumb.' + legacyId, t0);
    ok('迁移前：localStorage 里有老图', !!localStorage.getItem('dash.bg.img.' + legacyId));
    /* 再跑一次 start()，会重开存储并执行迁移 */
    Background.start('light');
    var moved = await new Promise(function (res) {
      var tries = 0;
      (function poll() {
        if (!localStorage.getItem('dash.bg.img.' + legacyId)) { res(true); return; }
        if (++tries > 120) { res(false); return; }
        setTimeout(poll, 50);
      })();
    });
    ok('迁移后 localStorage 里的老图被清掉', moved);
    ok('迁移后能从新存储读回数据', (await Background.getData(legacyId) || '').indexOf('data:image') === 0);
    ok('孤儿图补出了元数据条目', Background.list().some(function (m) { return m.id === legacyId; }));
    await Background.clearAll();
  } else {
    log('      跳过（当前是 localStorage 降级模式，没有可迁移的目标）');
  }

  /* ---------------- 拒绝非图片 ---------------- */
  log('\n=== 8. 拒绝非图片文件 ===');
  var bad = await Background.addFiles([new File(['hello'], 'note.txt', { type: 'text/plain' })]);
  ok('文本文件被拒', bad.added.length === 0 && bad.failed.length === 1, bad.failed[0] && bad.failed[0].why);

  log('\n' + (fail === 0 ? '全部通过 ✓' : '有 ' + fail + ' 项失败 ✗'));
  document.title = fail === 0 ? 'ALL PASS' : 'FAIL:' + fail;

  /* 通过 http 打开时把结果回传给 工具/run-test.js
     （--dump-dom 抓得太早，等不到 IndexedDB 回调） */
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    try {
      fetch('/__result', { method: 'POST', body: encodeURIComponent(out.join('\n')) });
    } catch (e) {}
  }
})();
</script>
</body></html>
